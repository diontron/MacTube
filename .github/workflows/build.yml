name: Build DMG

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: ./build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MacTube-2-dmg
          path: MacTube 2.dmg

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MacTube 2.dmg

name: Build DMG

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: ./build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MacTube2-dmg
          path: MacTube2.dmg

      # Every push to master (or a v* tag) becomes the "latest" release,
      # so the README download link always points at the newest build.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MacTube2.dmg
